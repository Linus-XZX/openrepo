version: "3.9"
volumes:
  openrepo-data:
services:
  nginx:
    image: git.lxzx.dev/linus_xu/openrepo:latest
    command: nginx
    restart: unless-stopped
    ports:
      - "7376:8080"
    depends_on:
      - "django"
    volumes:
      - type: volume
        source: openrepo-data
        target: /var/lib/openrepo

  django:
    image: git.lxzx.dev/linus_xu/openrepo:latest
    expose:
      - "8000"
    command: run_openrepoweb
    restart: unless-stopped
    volumes:
      - type: volume
        source: openrepo-data
        target: /var/lib/openrepo
      - type: bind
        source: /run/postgresql/.s.PGSQL.5432
        target: /run/postgresql/.s.PGSQL.5432
    environment:
      # - "OPENREPO_CSRF_TRUSTED_ORIGINS=myproxiedname.example.com"   #Multiple domains are space delimited"
      - OPENREPO_DB_TYPE=postgresql
      - OPENREPO_PG_DATABASE=openrepo
      - OPENREPO_PG_USERNAME=postgres
      - OPENREPO_PG_PASSWORD=postgres
      - OPENREPO_PG_HOSTNAME=db
    depends_on:
      - "db"

  worker:
    image: git.lxzx.dev/linus_xu/openrepo:latest
    command: ./django/manage.py runworker
    volumes:
      - type: volume
        source: openrepo-data
        target: /var/lib/openrepo
    restart: unless-stopped
    environment:
      - OPENREPO_DB_TYPE=postgresql
      - OPENREPO_PG_DATABASE=openrepo
      - OPENREPO_PG_USERNAME=postgres
      - OPENREPO_PG_PASSWORD=postgres
      - OPENREPO_PG_HOSTNAME=db
    depends_on:
      - "django"

  db:
    image: docker.io/postgres:16-alpine
    expose:
      - "5432"
    restart: unless-stopped
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_DB=openrepo
    volumes:
      - type: volume
        source: openrepo-data
        target: /var/lib/postgresql/data
        volume:
          subpath: postgres
